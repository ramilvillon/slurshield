[project]
name = "ngword"
version = "0.1.0"
requires-python = ">=3.11"
# Runtime (deployment) deps only — torch/transformers/optimum are NOT needed to serve.
dependencies = [
    "onnxruntime>=1.18",
    "tokenizers>=0.20",
    "numpy>=1.26",
    "pyahocorasick>=2.1",
]

[project.optional-dependencies]
# Everything needed to build the dataset, train, and export the model.
training = [
    "torch",
    "transformers>=4.44",
    "datasets>=2.20",
    "optimum[onnxruntime]>=1.21",
    "scikit-learn>=1.4",
    "pandas>=2.2",
    "pyarrow>=16",
    "accelerate>=0.26",
]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# `ngword` resolves from src/, `training` from the repo root.
pythonpath = ["src", "."]
