[project]
name = "ngword"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "transformers>=4.44",
    "datasets>=2.20",
    "optimum[onnxruntime]>=1.21",
    "onnxruntime>=1.18",
    "pyahocorasick>=2.1",
    "scikit-learn>=1.4",
    "pandas>=2.2",
    "pyarrow>=16",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
